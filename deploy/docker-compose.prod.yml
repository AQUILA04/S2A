# Amicale S2A — Contabo production stack
# Prerequisite: shared Traefik on network `traefik-public` (HTTPS + Let's Encrypt).
# Database: self-hosted Postgres (service `db` below).

services:
  db:
    image: postgres:16-alpine
    container_name: s2a-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-s2a}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-s2a}
    volumes:
      - s2a_pg_data:/var/lib/postgresql/data
      - ./db-migrations/V001__initial_schema.sql:/docker-entrypoint-initdb.d/01_v001.sql:ro
      - ./db-migrations/V002__rbac_and_account_status.sql:/docker-entrypoint-initdb.d/02_v002.sql:ro
      - ./db-migrations/V003__payment_channels.sql:/docker-entrypoint-initdb.d/03_v003.sql:ro
      - ./db-migrations/V004__must_change_password.sql:/docker-entrypoint-initdb.d/04_v004.sql:ro
      - ./db-migrations/V005__default_payment_channels.sql:/docker-entrypoint-initdb.d/05_v005.sql:ro
    networks:
      - s2a-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-s2a} -d ${DB_NAME:-s2a}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${IMAGE:-ghcr.io/aquila04/s2a:latest}
    container_name: s2a-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${DB_USER:-s2a}:${DB_PASSWORD}@db:5432/${DB_NAME:-s2a}
    networks:
      - traefik-public
      - s2a-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.s2a.rule=Host(`${APP_HOST:-s2a.optimizesolux.com}`)
      - traefik.http.routers.s2a.entrypoints=websecure
      - traefik.http.routers.s2a.tls=true
      - traefik.http.routers.s2a.tls.certresolver=letsencrypt
      - traefik.http.services.s2a.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  s2a_pg_data:

networks:
  traefik-public:
    external: true
  s2a-internal:
    driver: bridge
